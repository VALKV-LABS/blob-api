services:
  # ── Postgres (integ only — unit tests run cargo test with no DB) ──────────────
  # Standalone: an empty database, blob-api connected as its owner.
  postgres-test:
    profiles: ["integ"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: storage_test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: storage_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storage_test"]
      interval: 3s
      timeout: 3s
      retries: 15

  # Beside an auth service: supabase/postgres, which already has the auth
  # schema, the API roles and an older storage schema. blob-api connects as the
  # non-superuser supabase_storage_admin, as in a Supabase-style stack.
  postgres-supabase-test:
    profiles: ["integ"]
    image: supabase/postgres:15.8.1.060
    environment:
      POSTGRES_PASSWORD: test
      POSTGRES_DB: postgres
    healthcheck:
      # Ready once its init has created auth.users (the server restarts during
      # init, so pg_isready alone answers too early).
      test: ["CMD-SHELL", "psql -h 127.0.0.1 -U supabase_admin -d postgres -tAc 'select 1 from auth.users limit 1' >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 40

  # What the rest of a Supabase-style stack would have done:
  #   - the service roles' passwords (the image sets only postgres' and
  #     supabase_admin's; Supabase's own setup does this in roles.sql);
  #   - the test users in auth.users, which the image's storage tables
  #     reference for `owner`.
  supabase-seed-test:
    profiles: ["integ"]
    image: supabase/postgres:15.8.1.060
    environment:
      PGPASSWORD: test
    entrypoint: ["psql", "-h", "postgres-supabase-test", "-U", "supabase_admin", "-d", "postgres", "-v", "ON_ERROR_STOP=1", "-c",
                 "alter role supabase_storage_admin with password 'test'", "-c",
                 "insert into auth.users (id) values ('11111111-0000-0000-0000-000000000001'), ('22222222-0000-0000-0000-000000000002') on conflict do nothing"]
    depends_on:
      postgres-supabase-test:
        condition: service_healthy

  # ── S3 (integ only) ───────────────────────────────────────────────────────────
  # LocalStack: MinIO no longer publishes images. blob-api creates the bucket.
  s3-test:
    profiles: ["integ"]
    image: localstack/localstack:4
    environment:
      SERVICES: s3
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:4566/_localstack/health"]
      interval: 3s
      timeout: 5s
      retries: 30

  # ── Blob API under test ───────────────────────────────────────────────────────
  blob-api-test:
    profiles: ["integ"]
    build:
      context: .
      dockerfile: Dockerfile
    image: valkvlabs/blob-api:test
    environment: &blob-env
      DATABASE_URL: postgresql://storage_test:test@postgres-test:5432/storage_test
      PGRST_JWT_SECRET: test-jwt-secret-32bytes-padded-ok
      ANON_KEY: ""
      SERVICE_KEY: ""
      GLOBAL_S3_BUCKET: test-bucket
      GLOBAL_S3_ENDPOINT: http://s3-test:4566
      GLOBAL_S3_FORCE_PATH_STYLE: "true"
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: testkey
      AWS_SECRET_ACCESS_KEY: testsecret
      TENANT_ID: test-tenant
      PORT: "5000"
      RUST_LOG: "valkv_blob=debug"
    healthcheck: &blob-health
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:5000/storage/v1/health | grep -q ok"]
      interval: 5s
      timeout: 5s
      retries: 15
    depends_on:
      postgres-test:
        condition: service_healthy
      s3-test:
        condition: service_healthy

  # The same build, beside an auth service (postgres-supabase-test above).
  blob-api-supabase-test:
    profiles: ["integ"]
    image: valkvlabs/blob-api:test
    environment:
      <<: *blob-env
      DATABASE_URL: postgresql://supabase_storage_admin:test@postgres-supabase-test:5432/postgres
      GLOBAL_S3_BUCKET: test-bucket-supabase
    healthcheck: *blob-health
    depends_on:
      supabase-seed-test:
        condition: service_completed_successfully
      s3-test:
        condition: service_healthy

  # ── Integration test runners ──────────────────────────────────────────────────
  blob-integ-tests:
    profiles: ["integ"]
    image: node:20-alpine
    working_dir: /integ
    volumes:
      - ./test:/integ
    command: node blob-integ.js
    environment:
      STORAGE_URL: http://blob-api-test:5000
      JWT_SECRET: test-jwt-secret-32bytes-padded-ok
    depends_on:
      blob-api-test:
        condition: service_healthy

  blob-integ-tests-supabase:
    profiles: ["integ"]
    image: node:20-alpine
    working_dir: /integ
    volumes:
      - ./test:/integ
    command: node blob-integ.js
    environment:
      STORAGE_URL: http://blob-api-supabase-test:5000
      JWT_SECRET: test-jwt-secret-32bytes-padded-ok
    depends_on:
      blob-api-supabase-test:
        condition: service_healthy

  # ── Unit tests (cargo test — no external services needed) ─────────────────────
  blob-unit-tests:
    profiles: ["unit"]
    image: rust:1.92-slim-bookworm
    working_dir: /app
    volumes:
      - .:/app
      - cargo_registry:/usr/local/cargo/registry
    command: sh -c "apt-get update -qq && apt-get install -y -qq libssl-dev pkg-config 2>/dev/null && cargo test"
    environment:
      RUST_BACKTRACE: "1"
      CARGO_TERM_COLOR: always

volumes:
  cargo_registry:
